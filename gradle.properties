pluginGroup=de.drochmann
pluginVersion=0.1.0
pluginSinceBuild=262

# Standard: die Plattform wird heruntergeladen, damit ein frischer Klon ueberall baut.
platformVersion=2026.2.0.1

# Wer gegen eine lokale IDEA-Installation bauen will, spart damit den Download von rund
# zwei Gigabyte. Der Pfad ist rechnerabhaengig und gehoert deshalb nicht hierher, sondern
# in die globale ~/.gradle/gradle.properties - genauso wie die Signier- und
# Marketplace-Geheimnisse:
#
#     platformLocalPath=C:/Pfad/zu/IntelliJ IDEA

org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
